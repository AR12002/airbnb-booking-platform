spring.application.name=airBnbApp

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/airBnb}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=/api/v1

# Security - use environment variables in production
jwt.secretKey=${JWT_SECRET_KEY:dev-only-jwt-secret-key-change-this-before-production-123456789}

frontend.url=${FRONTEND_URL:http://localhost:8080}

# Stripe - set real values through environment variables when using payments
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
